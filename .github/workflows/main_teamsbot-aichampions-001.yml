# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - teamsbot-aichampions-001

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (match Azure)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install deps + build (NO Azure build anymore)
      - name: Install dependencies and build
        env:
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
          MicrosoftAppId: ${{ secrets.MicrosoftAppId }}
          MicrosoftAppPassword: ${{ secrets.MicrosoftAppPassword }}
          MicrosoftAppType: ${{ secrets.MicrosoftAppType }}
          MicrosoftAppTenantId: ${{ secrets.MicrosoftAppTenantId }}
        run: |
          npm ci
          npm run build --if-present

      # 4️⃣ Upload ready-to-run app
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 5️⃣ Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # 6️⃣ Azure login
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_619E0D53D08F4533BB9B21D6EAAA2154 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC5026E6712845D59D6C66D6EDEA7D12 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25841A74A099471B93686ED1DE7F2882 }}

      # 7️⃣ Deploy (NO BUILD HERE)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: teamsbot-aichampions-001
          slot-name: Production
          package: .
